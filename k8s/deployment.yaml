apiVersion: apps/v1
kind: Deployment

metadata:
  name: node-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app

    spec:
      containers:
        - name: node-app

          image: kubernetes-node-app:v2

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"
