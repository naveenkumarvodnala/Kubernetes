apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api

    spec:
      containers:
        - name: task-api

          image: kubernetes-task-api:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: task-api-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: task-api-config
                  key: PORT

            - name: MONGO_URL
              value: "mongodb://admin:password123@mongodb-service:27017/tasks?authSource=admin"
